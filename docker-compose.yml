services:
  librecrawl:
    build: .
    container_name: librecrawl
    ports:
      # In local mode: only localhost (127.0.0.1:5000)
      # In production mode: all interfaces (0.0.0.0:5000) for LAN/WAN access
      - "${HOST_BINDING:-127.0.0.1}:${EXTERNAL_PORT:-5000}:5000"
    volumes:
      # Persist the user database and settings
      - ./data:/app/data
    environment:
      - FLASK_APP=main.py
      - PYTHONUNBUFFERED=1
      # Set to "true" for local mode (no authentication), "false" for production
      # Defaults to "false" — local mode disables all auth and grants admin to everyone
      - LOCAL_MODE=${LOCAL_MODE:-false}
      # Set to "true" to disable new user registrations
      - REGISTRATION_DISABLED=${REGISTRATION_DISABLED:-false}
      # Set to "true" for demo mode (1.5GB per-user memory limit)
      - DEMO_MODE=${DEMO_MODE:-false}
      # DANGEROUS: Set to "true" to allow login as any username with no password
      # (username only used to separate sessions). Do NOT use in production.
      - DANGEROUSLY_SKIP_AUTH=${DANGEROUSLY_SKIP_AUTH:-false}
      # Set to "true" to turn off guest login
      - DISABLE_GUEST=${DISABLE_GUEST:-false}
      # Listen on all container interfaces. HOST_BINDING above decides who can reach the port.
      - BIND_HOST=0.0.0.0
      # Local mode may listen on those interfaces because the published port limits access
      - LOCAL_MODE_ALLOW_LAN=true
      # Set to "true" only behind a reverse proxy you control, so guest limits use the real client IP
      - TRUST_PROXY=${TRUST_PROXY:-false}
      # Set to "true" only to crawl sites on this machine or your LAN
      - ALLOW_PRIVATE_TARGETS=${ALLOW_PRIVATE_TARGETS:-false}
      # Session signing key. Without it sessions reset on every restart.
      - SECRET_KEY=${SECRET_KEY:-}
      # SMTP for verification emails (empty values fall back to the defaults in src/email_service.py)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-}
      # Base URLs for the links in verification emails and redirects
      - MAIN_APP_URL=${MAIN_APP_URL:-}
      - WORKSHOP_APP_URL=${WORKSHOP_APP_URL:-}
      # Zoho OAuth login (see .env.example for details)
      - ZOHO_OAUTH_ENABLED=${ZOHO_OAUTH_ENABLED:-false}
      - ZOHO_CLIENT_ID=${ZOHO_CLIENT_ID:-}
      - ZOHO_CLIENT_SECRET=${ZOHO_CLIENT_SECRET:-}
      - ZOHO_REDIRECT_URI=${ZOHO_REDIRECT_URI:-}
      - ZOHO_ACCOUNTS_URL=${ZOHO_ACCOUNTS_URL:-}
      - ZOHO_SCOPES=${ZOHO_SCOPES:-}
      - ZOHO_ALLOWED_DOMAINS=${ZOHO_ALLOWED_DOMAINS:-}
      - ZOHO_ALLOW_SIGNUP=${ZOHO_ALLOW_SIGNUP:-}
      - ZOHO_DEFAULT_TIER=${ZOHO_DEFAULT_TIER:-}
    restart: unless-stopped
    command: >
      sh -c "
      FLAGS='';
      if [ \"$$LOCAL_MODE\" = \"true\" ]; then
        FLAGS=\"$$FLAGS --local\";
      fi;
      if [ \"$$REGISTRATION_DISABLED\" = \"true\" ]; then
        FLAGS=\"$$FLAGS --disable-register\";
      fi;
      if [ \"$$DEMO_MODE\" = \"true\" ]; then
        FLAGS=\"$$FLAGS --demo\";
      fi;
      if [ \"$$DANGEROUSLY_SKIP_AUTH\" = \"true\" ]; then
        FLAGS=\"$$FLAGS --dangerously-skip-auth\";
      fi;
      python main.py $$FLAGS"

    # Increase shared memory size for Chrome to prevent crashes
    shm_size: '2gb'

